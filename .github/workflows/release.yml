name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: Publish GitHub release with the .deb attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ $GITHUB_REF_NAME == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $prerelease

  publish-apt:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read 
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils gnupg
      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          [[ -n $APT_GPG_PRIVATE_KEY ]] || { echo "::error::secret APT_GPG_PRIVATE_KEY is not set (see docs/RELEASING.md)"; exit 1; }
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          have=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          want=$(<keys/FINGERPRINT)
          if [[ $have != "$want" ]]; then
            echo "::error::secret key $have does not match committed public key $want"
            exit 1
          fi
          echo "SIGN_KEY_ID=$have" >> "$GITHUB_ENV"
      - name: Collect every released .deb (older versions stay installable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pool
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir pool --skip-existing || true
          done
          ls -l pool
      - name: Build and sign the repository
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          repo=${GITHUB_REPOSITORY#*/}
          echo "PAGES_URL=https://${owner}.github.io/${repo}" >> "$GITHUB_ENV"
          scripts/make-apt-repo.sh pool site "https://${owner}.github.io/${repo}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  verify:
    needs: publish-apt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install with the public one-liner
        run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
          owner=${GITHUB_REPOSITORY_OWNER,,}; repo=${GITHUB_REPOSITORY#*/}
          url="https://${owner}.github.io/${repo}"
          for i in $(seq 1 24); do # Pages can take a minute to serve the new files
            curl -fsSL "$url/install.sh" -o /tmp/install.sh && break
            echo "waiting for Pages ($i/24)"; sleep 10
          done
          bash /tmp/install.sh
      - name: Installed version is the tagged version
        run: test "$(bitcalc --version)" = "bitcalc ${GITHUB_REF_NAME#v}"
      - name: Uninstall with the public one-liner
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}; repo=${GITHUB_REPOSITORY#*/}
          curl -fsSL "https://${owner}.github.io/${repo}/uninstall.sh" | bash
          ! command -v bitcalc
          ! test -e /etc/apt/sources.list.d/bitcalc.sources
