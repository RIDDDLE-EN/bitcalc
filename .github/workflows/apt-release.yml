name: Build and Publish APT Repository

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install APT Packaging Tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gzip shc build-essential 

      - name: Build Debian Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          mkdir -p build_dir/usr/share/bitcalc
          mkdir -p build_dir/usr/share/man/man1
          mkdir -p build_dir/DEBIAN

          sed "s/{{VERSION}}/$VERSION/g" control.template > build_dir/DEBIAN/control
          
          cp bitcalc_source build_dir/usr/share/bitcalc_source
          chmod 644 build_dir/usr/share/bitcalc_source
          sed -i 's/\r$//' build_dir/usr/share/bitcalc_source

          if [-d "DEBIAN" ]; then
            cp DEBIAN/* build_dir/DEBIAN/
            chmod 755 build_dir/DEBIAN/*
          fi

          if [ -f "bitcalc.1" ]; then
            cp bitcalc.1 build_dir/usr/share/man/man1/bitcalc.1
            gzip -9 -f build_dir/usr/share/man/man1/bitcalc.1
            chmod 644 build_dir/usr/share/man/man1/bitcalc.1.gz
          fi

          dpkg-deb --root-owner-group --build build_dir bitcalc_${VERSION}_all.deb

      - name: Test Installed Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Installing the built package locally for testing..."
          sudo dpkg -i "bitcalc_${VERSION}_all.deb"

          echo "Testing binary execution"
          bitcalc --help > /dev/null

          echo "Testing mathematical output..."
          OUTPUT=$(bitcalc -q 10 ADD 2)
          if [ "$OUTPUT" != "12" ]; then
            echo "Test failed: Expected 12, got $OUTPUT"
            exit
          fi

          echo "Testing Base Conversion..."
          OUTPUT=$(bitcalc -q -t bin 0xA)
          if [ "$OUTPUT" != "0b00001010" ]; then
            echo "Test Failed: Expected 0b00001010 got $OUTPUT"
            exit 1
          fi

          echo "All structural and logic tests passed successfully!"

      - name: Generate APT Repository Index & Easy-Install Script
        run: |
          mkdir -p apt-repo/pool/main
          mv *.deb apt-repo/pool/main/
          cd apt-repo
          dpkg-scanpackages pool/main /dev/null | gzip -9c > Packages.gz

          cat << 'EOF' > install.sh
          #!/usr/bin/bash
          set -e

          SUDO=""
          if[ "$(id -u)" -ne 0 ]; then
            if command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            else
              echo "Error: Root access or sudo is required to install packages." >&2
              exit 1
            fi
          fi

          echo "Setting up bitcalc repository..."
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq ca-certificates curl shc

          cat << 'REPO' | $SUDO tee /etc/apt/sources.list.d/bitcalc.sources > /dev/null
          Types: deb
          URIs: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          Suites: ./
          Trusted: yes
          REPO

          echo "Installing bitcalc..."
          $SUDO apt-get update -qq
          $SUDO apt-get install -y bitcalc

          echo "Success! bitcalc is now installed. Type 'bitcalc --help' to get started."
          EOF
          chmod +x install.sh


          cat<< 'EOF' > uninstall.sh
          #!/usr/bin/bash
          set -e
          echo "Removing bitcalc..."

          SUDO=""
          if[ "$(id -u)" -ne 0 ]; then
            if command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            else
              echo "Error: Root access or sudo is required to remove packages." >&2
              exit 1
            fi
          fi
  
          if dpkg -l | grep -q bitcalc; then
            $SUDO apt-get remove -y bitcalc
          fi

          if [ -f /etc/apt/sources.list.d/bitcalc.sources ]; then
            echo "Removing bitcalc repository source..."
            $SUDO rm -f /etc/apt/sources.list.d/bitcalc.sources
            $SUDO apt-get update -qq
          fi

          echo "bitcalc has been successfully uninstalled from your system."
          EOF
          chmod +x uninstall.sh

      - name: Deploy APT Repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          keep_files: true
